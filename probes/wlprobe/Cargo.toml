[package]
name = "wlprobe"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Throwaway M0 protocol probes for the Hyprland route (SPEC R2, R3, R4, R7, R8)"

[dependencies]
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
png = "0.18"
