name: Update release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify published release and generate package metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(node scripts/release-version.js)" = "$VERSION"
          archives="$RUNNER_TEMP/release-packages"
          gh release download "v$VERSION" --dir "$archives" --pattern 'checksums.txt' --pattern 'agent-desktop-v*.tar.gz'
          gh attestation verify "$archives/checksums.txt" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref refs/heads/main --deny-self-hosted-runners
          node scripts/update-release-packages.js "$archives"
      - name: Open package update PR
        id: packages
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ github.token }}
          base: main
          branch: release/packages-v${{ inputs.version }}
          add-paths: |
            Formula/agent-desktop.rb
            bucket/agent-desktop.json
            npm/package.json
          author: Lahfir <70215676+lahfir@users.noreply.github.com>
          committer: Lahfir <70215676+lahfir@users.noreply.github.com>
          commit-message: 'chore: update packages to ${{ inputs.version }}'
          title: 'chore: update packages to ${{ inputs.version }}'
          body: |
            Update Homebrew, Scoop and the npm source manifest to the Cargo release version.
            Archive hashes were checked against the published checksum manifest, whose release-workflow attestation was verified.
            Native installation and repository checks are dispatched on this branch. Merge after review and green checks.
      - name: Run checks on the generated branch
        if: steps.packages.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.packages.outputs.pull-request-branch }}
        run: |
          for workflow in ci.yml supply-chain.yml codeql.yml homebrew.yml scoop.yml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
