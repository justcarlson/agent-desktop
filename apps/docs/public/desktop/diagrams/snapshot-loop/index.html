<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton, drill-down, act, verify</title>
<script>
  var t = new URLSearchParams(location.search).get("theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  if (window.self === window.top) document.documentElement.setAttribute("data-top", "");
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --panel: #0a0a0a; --node: #111; --border: #5c5c5c;
    --fg: #ededed; --muted: #8f8f8f; --line: #8f8f8f; --line-strong: #ededed;
    --hl-fill: #0a2a5e; --hl-ring: #1e5fd6; --hl-icon: #cfe0ff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --bg: #fff; --panel: #fafafa; --node: #fff; --border: #b8b8b8;
      --fg: #171717; --muted: #666; --line: #7a7a7a; --line-strong: #171717;
      --hl-fill: #dbe8ff; --hl-ring: #2563eb; --hl-icon: #1d4ed8;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fff; --panel: #fafafa; --node: #fff; --border: #b8b8b8;
    --fg: #171717; --muted: #666; --line: #7a7a7a; --line-strong: #171717;
    --hl-fill: #dbe8ff; --hl-ring: #2563eb; --hl-icon: #1d4ed8;
  }
  html, body { margin: 0; background: transparent; }
  :root[data-top], :root[data-top] body { background: var(--bg); }
  svg { display: block; width: 100%; height: auto; font-family: Geist, "Geist Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { fill: var(--panel); stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
  .node { fill: var(--node); }
  .label { fill: var(--fg); font-size: 15px; text-anchor: middle; }
  .sub { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }
  .head { fill: var(--fg); font-size: 16px; font-weight: 500; }
  .tag { fill: var(--muted); font-size: 12.5px; text-anchor: middle; }
  .wire { fill: none; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; marker-end: url(#arrow); }
  .wire.strong { stroke: var(--line-strong); }
  .icon { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .icon.fg { stroke: var(--fg); }
  .hl { fill: var(--hl-fill); stroke: var(--hl-ring); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .hl-icon { fill: none; stroke: var(--hl-icon); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  #arrow path { fill: none; stroke: var(--line); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Skeleton, drill-down, act, verify</title>
  <desc id="d">Start with snapshot --skeleton, a depth 3 map with children_count on cut branches. Pick a node with a ref and children_count and run snapshot --root on it to read that region into the same snapshot. Act on a ref from the drill, such as click. Verify with wait or get, or by re-running snapshot --root on the same root, then act again or drill another region.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L5.5 4 L1.5 6.5"/>
    </marker>
  </defs>

  <path class="wire strong" d="M78 92H110"/>
  <circle class="hl" cx="44" cy="92" r="30"/>
  <g transform="translate(32 80)">
    <circle class="hl-icon" cx="12" cy="12" r="9"/>
    <ellipse class="hl-icon" cx="12" cy="12" rx="4" ry="9"/>
    <path class="hl-icon" d="M3 12h18"/>
  </g>
  <text class="tag" x="44" y="140">start</text>

  <rect class="box node" x="116" y="60" width="200" height="64" rx="6"/>
  <text class="label" x="216" y="86">snapshot --skeleton</text>
  <text class="sub" x="216" y="103">depth 3, children_count</text>

  <path class="wire strong" d="M322 92H414"/>
  <text class="tag" x="368" y="84">pick a region</text>

  <rect class="box node" x="420" y="60" width="200" height="64" rx="6"/>
  <text class="label" x="520" y="86">snapshot --root</text>
  <text class="sub" x="520" y="103">same snapshot_id, new refs</text>

  <path class="wire strong" d="M520 130V210"/>
  <text class="tag" style="text-anchor:start" x="530" y="174">act on a ref</text>

  <rect class="box node" x="420" y="216" width="200" height="64" rx="6"/>
  <text class="label" x="520" y="242">click @s…:eN</text>
  <text class="sub" x="520" y="259">or set-value, select, ...</text>

  <path class="wire strong" d="M414 248H322"/>
  <text class="tag" x="368" y="240">verify</text>

  <rect class="box node" x="116" y="216" width="200" height="64" rx="6"/>
  <text class="label" x="216" y="242">wait, get, or re-drill</text>
  <text class="sub" x="216" y="259">read the result back</text>

  <path class="wire" d="M216 286V298a14 14 0 0 0 14 14H638a14 14 0 0 0 14-14V106a14 14 0 0 0-14-14H626"/>
  <text class="tag" x="434" y="304">next action or region</text>
</svg>
</body>
</html>
